<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa Status Checker - London MCS Consultants</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 31, 63, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #ffd700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #001f3f;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #001f3f;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.approved {
            background: #e8f5e9;
            border-left: 5px solid #4caf50;
        }

        .result.pending {
            background: #fff3e0;
            border-left: 5px solid #ff9800;
        }

        .result.denied {
            background: #ffebee;
            border-left: 5px solid #f44336;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result.approved .result-title { color: #2e7d32; }
        .result.pending .result-title { color: #f57c00; }
        .result.denied .result-title { color: #c62828; }

        .result-message {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .success-banner {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.5s ease;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 13px;
            color: #1565c0;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">✈️</div>
                <span>LONDON MCS</span>
            </div>
            <p>Free Visa Status Checker</p>
        </div>

        <div class="content">
            <div class="success-banner" id="successBanner">
                ✓ Your information has been received. Our team will contact you soon!
            </div>

            <form id="visaCheckerForm">
                <div class="form-group">
                    <label for="refNumber">Visa Reference Number *</label>
                    <input type="text" id="refNumber" name="refNumber" placeholder="e.g., LM-2024-12345" required>
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" placeholder="+44 7xxx xxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="visaType">Visa Type *</label>
                    <select id="visaType" name="visaType" required>
                        <option value="">-- Select Visa Type --</option>
                        <option value="student">Student Visa</option>
                        <option value="tourist">Tourist Visa</option>
                        <option value="business">Business & Investor Visa</option>
                        <option value="entertainment">Entertainment Visa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="country">Destination Country *</label>
                    <select id="country" name="country" required>
                        <option value="">-- Select Country --</option>
                        <optgroup label="Common Destinations">
                            <option value="uk">United Kingdom</option>
                            <option value="usa">United States of America</option>
                            <option value="australia">Australia</option>
                            <option value="newzealand">New Zealand</option>
                            <option value="canada">Canada</option>
                        </optgroup>
                        <optgroup label="Schengen Countries">
                            <option value="italy">Italy</option>
                            <option value="france">France</option>
                            <option value="germany">Germany</option>
                            <option value="switzerland">Switzerland</option>
                            <option value="norway">Norway</option>
                        </optgroup>
                    </select>
                </div>

                <button type="submit">Check Visa Status</button>
            </form>

            <div class="result" id="result"></div>

            <div class="info-box">
                <strong>ℹ️ About this checker:</strong><br>
                Enter your visa reference number to check the status of your application. Our team will contact you shortly.
            </div>
        </div>
    </div>

    <script>
        const visaDatabase = {
            'LM-2024-12345': { status: 'approved', message: 'Your visa application has been approved!' },
            'LM-2024-12346': { status: 'pending', message: 'Your application is currently under review.' },
            'LM-2024-12347': { status: 'denied', message: 'Unfortunately, your application was not approved.' },
            'LM-2024-12348': { status: 'approved', message: 'Congratulations! Your visa has been approved.' },
            'LM-2024-12349': { status: 'pending', message: 'Documents received. Review in progress.' },
        };

        document.getElementById('visaCheckerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const refNumber = document.getElementById('refNumber').value;
            const visaInfo = visaDatabase[refNumber] || { status: 'pending', message: 'Application status: Pending verification.' };
            
            const resultDiv = document.getElementById('result');
            const statusText = visaInfo.status === 'approved' ? 'APPROVED ✓' : visaInfo.status === 'pending' ? 'PENDING ⏳' : 'DENIED ✗';
            
            resultDiv.innerHTML = '<div class="result-title">' + statusText + '</div><div class="result-message">' + visaInfo.message + '</div>';
            resultDiv.className = 'result ' + visaInfo.status;
            resultDiv.style.display = 'block';
            
            document.getElementById('successBanner').style.display = 'block';
            setTimeout(() => document.getElementById('successBanner').style.display = 'none', 5000);
        });
    </script>
</body>
</html>
